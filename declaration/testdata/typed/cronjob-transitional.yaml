apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: cronjobs.batch.example.com}
spec:
  group: batch.example.com
  scope: Namespaced
  names: {kind: CronJob, plural: cronjobs}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas: {type: integer}
                timeoutSeconds: {type: string}
                scaling:
                  type: object
                  properties:
                    min: {type: integer}
                image: {type: string}
